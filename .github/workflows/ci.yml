name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读。仓库里的代码会被这里执行（冒烟启动），
# 不给写权限等于断了「注入 → push → CI 改仓库」这条链。
permissions:
  contents: read

jobs:
  test:
    name: 引用检查 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 只是为了让 env.js 的必填校验过掉，不会发起任何真实请求
      DEEP_SEEK_API_KEY: sk-ci-placeholder
      QQ_APP_ID: '1000000'
      QQ_APP_SECRET: '0123456789abcdef0123456789abcdef'
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态引用检查
        run: pnpm check

      - name: 单元测试
        run: pnpm test

      # 冒烟启动会真的执行仓库里的代码。只在 push 到 main 时跑，
      # PR 不跑——PR 可能来自 fork，执行它的代码等于给外部提交一个执行入口。
      - name: 冒烟启动（不连 QQ，只验证装配）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 5 秒后强杀：能起来、工具注册成功就算过
          timeout 5 node src/index.js 2>&1 | tee boot.log || true
          grep -q "启动" boot.log || (echo "启动日志里没有任何 [启动] 记录" && exit 1)
        continue-on-error: true
